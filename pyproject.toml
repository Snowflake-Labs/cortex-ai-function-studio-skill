[project]
name = "custom-ai-function"
version = "0.1.0"
description = "Create, evaluate, and optimize custom AI functions using Snowflake Cortex AI_COMPLETE"
requires-python = ">=3.12,<3.13"
dependencies = [
    "datasets>=2.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "snowflake-connector-python>=3.0.0",
    "snowflake-snowpark-python>=1.0.0",
    "gepa>=0.0.19",
    "jinja2>=3.0.0",
]

[dependency-groups]
test = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
